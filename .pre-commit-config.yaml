# Thin pre-commit set (ADR-0017 / D-044 / D-045).
# Local:  pip install -e ".[dev]" && pre-commit install && pre-commit run --all-files
# CI fallback: lint job in .github/workflows/ci.yml (guards --no-verify pushes).
# Hook rev upkeep: dependabot pre-commit ecosystem (monthly) or manual
#   `pre-commit autoupdate` — always through human review, never pre-commit.ci.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20 # aligned with ci.yml (uvx ruff@0.15.20) and the dev venv
    hooks:
      - id: ruff-check
      - id: ruff-format
